# Publishes to npm with provenance when a version tag is pushed: `npm version minor && git push --follow-tags`.
# Needs the repository secret NPM_TOKEN (an npm automation token).
name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - name: Publish create-tablecraft when its version is new
        working-directory: packages/create-tablecraft
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "create-tablecraft@$v" version >/dev/null 2>&1; then echo "create-tablecraft@$v already published"; else npm publish --provenance --access public; fi
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - name: GitHub release from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Tablecraft $v" --notes-file notes.md
        env: { GH_TOKEN: "${{ github.token }}" }
